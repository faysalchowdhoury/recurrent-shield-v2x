name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.0.1
          pip install numpy==1.24.3 scipy==1.10.1 pandas==1.5.3 matplotlib==3.7.1 requests==2.34.2 onnx==1.15.0 pytest==7.3.1
      - name: Run unit tests
        run: pytest -v
      - name: Validate public submission assets
        run: python experiments/validate_submission_assets.py
